<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乔柏晨的个人主页</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #007aff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        h1 {
            font-size: 26px;
            color: #1d1d1f;
        }
        p.subtitle {
            color: #86868b;
            font-size: 15px;
            margin-top: 5px;
        }
        .section {
            margin-bottom: 20px;
        }
        h2 {
            font-size: 18px;
            color: #007aff;
            margin-bottom: 10px;
            border-left: 4px solid #007aff;
            padding-left: 10px;
        }
        ul {
            list-style: none;
            padding-left: 10px;
        }
        li {
            padding: 6px 0;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="avatar">乔</div>
        <h1>乔柏晨</h1>
        <p class="subtitle">欢迎来到我的个人主页</p >
    </div>

    <div class="section">
        <h2>关于我</h2>
        <ul>
            <li>📍 所在地：河南汝州</li>
            <li>🏀 爱好：篮球、游泳、钢琴、CS2</li>
        </ul>
    </div>

    <div class="section">
        <h2>个人简介</h2>
        <p>这是我的第一个个人独立主页，基于 GitHub Pages 免费部署上线。</p >
    </div>
</div>

</body>
</html>
